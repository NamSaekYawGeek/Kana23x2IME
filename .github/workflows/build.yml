name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build dictionary
        run: python3 tools/build_dictionary.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kana23x2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling dev APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build "$APK#Kana23x2IME-debug.apk" --clobber
          else
            gh release create dev-build "$APK#Kana23x2IME-debug.apk" \
              --title "Kana23x2IME dev build" \
              --notes "Rolling debug build for on-device testing."
          fi
